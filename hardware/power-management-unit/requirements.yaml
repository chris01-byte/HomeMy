schema_version: 2
project: HomeMy
artifact: power_management_unit
revision: "0.2-rev-a"
date: "2026-09-10"
handoff_state: complete_rev_a_prototype_authorized

release_state:
  rev_a_engineering_prototype:
    schematic_and_layout_required: true
    fabrication_package_generation_allowed: true
    fabrication_order_requires_human_review: true
    production_use_allowed: false
  rev_b_production:
    release: false
    requires_rev_a_measurement_evidence: true

status_vocabulary:
  LOCKED: implement_as_written
  PROVISIONAL: implement_configurably_and_validate
  REV_A_DESIGN: astra_selects_calculates_and_documents_for_the_prototype
  REV_A_ASSUMPTION: use_a_conservative_configurable_prototype_choice_and_record_it
  REV_A_ENERGIZATION_GATE: does_not_block_pcb_design_but_must_be_closed_before_battery_power_is_applied
  REV_B_VALIDATION: measure_with_rev_a_and_close_before_production_release

source_precedence:
  - hardware/power-management-unit/requirements.yaml
  - hardware/power-management-unit/ASTRA_PCB_HANDOFF.md
  - hardware/power-management-unit/interfaces-and-layout.md
  - docs/decisions/2026-09-10-battery-monitor-and-power-architecture.md
  - contracts/hardware/customer-power-on.md
  - contracts/ros/system-lifecycle.md

