name: Context guard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate bounded context packets
        run: python tools/context/brief.py --check
