name: ROS checks

on:
  push:
    paths:
      - 'src/**'
      - 'contracts/api/app-bridge.md'
      - 'contracts/ros/motion-gate.md'
      - 'contracts/hardware/manual-drive.md'
      - 'contracts/hardware/drivebase-commissioning.md'
      - '.github/workflows/ros-checks.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'contracts/api/app-bridge.md'
      - 'contracts/ros/motion-gate.md'
      - 'contracts/hardware/manual-drive.md'
      - 'contracts/hardware/drivebase-commissioning.md'
      - '.github/workflows/ros-checks.yml'

permissions:
  contents: read

jobs:
  jazzy:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          apt-get update
          rosdep update --rosdistro jazzy
          rosdep install --from-paths src --ignore-src -y --rosdistro jazzy
          # The drive driver uses the Modbus library versions it was proven with.
          apt-get install -y python3-pip
          python3 -m pip install --break-system-packages -r src/homemy_drivebase/requirements-modbus.txt
      - name: Build
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --base-paths src --event-handlers console_cohesion+
      - name: Test, including the end-to-end tests in simulation (bridge, drive driver, mapping drive)
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon test --base-paths src --event-handlers console_cohesion+
          colcon test-result --all --verbose
