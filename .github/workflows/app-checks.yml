name: App checks

on:
  push:
    paths:
      - 'ios/**'
      - 'contracts/api/app-bridge.md'
      - '.github/workflows/app-checks.yml'
  pull_request:
    paths:
      - 'ios/**'
      - 'contracts/api/app-bridge.md'
      - '.github/workflows/app-checks.yml'

permissions:
  contents: read

jobs:
  mock-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Mock bridge contract tests
        run: python -m unittest discover -s ios/HomeMy/Tools -p 'test_mock_rosbridge.py' -v

  app:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Protocol, policy, and map geometry tests
        run: swift test --package-path ios/HomeMy
      - name: iOS simulator build
        run: >-
          xcodebuild
          -project ios/HomeMy/HomeMy.xcodeproj
          -scheme HomeMy
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Signing settings come from the xcconfig, and a local file overrides them
        run: |
          set -euo pipefail
          settings() {
            xcodebuild -project ios/HomeMy/HomeMy.xcodeproj -scheme HomeMy \
              -configuration Debug -showBuildSettings 2>/dev/null
          }
          settings > default.txt
          grep -q '^ *PRODUCT_BUNDLE_IDENTIFIER = com.example.HomeMy$' default.txt
          printf 'DEVELOPMENT_TEAM = ABCDE12345\nPRODUCT_BUNDLE_IDENTIFIER = org.example.ci.HomeMy\n' \
            > ios/HomeMy/Config/Local.xcconfig
          settings > local.txt
          grep -q '^ *PRODUCT_BUNDLE_IDENTIFIER = org.example.ci.HomeMy$' local.txt
          grep -q '^ *DEVELOPMENT_TEAM = ABCDE12345$' local.txt
          rm ios/HomeMy/Config/Local.xcconfig
