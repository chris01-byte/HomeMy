name: App checks

on:
  push:
    paths:
      - 'ios/**'
      - 'contracts/api/app-bridge.md'
      - '.github/workflows/app-checks.yml'
  pull_request:
    paths:
      - 'ios/**'
      - 'contracts/api/app-bridge.md'
      - '.github/workflows/app-checks.yml'

permissions:
  contents: read

jobs:
  mock-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Mock bridge contract tests
        run: python -m unittest discover -s ios/HomeMy/Tools -p 'test_mock_rosbridge.py' -v

  app:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Protocol, policy, and map geometry tests
        run: swift test --package-path ios/HomeMy
      - name: iOS simulator build
        run: >-
          xcodebuild
          -project ios/HomeMy/HomeMy.xcodeproj
          -scheme HomeMy
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
